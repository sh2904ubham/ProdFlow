version: "3.8"

services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - tm-net

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    networks:
      - tm-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - tm-net
    restart: unless-stopped

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - tm-net
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      BACKEND_API: http://backend:5000
      OPENCLAW_API: http://openclaw:8080
    depends_on:
      - backend
      - openclaw
    networks:
      - tm-net
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  tm-net:
    driver: bridge
