version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: tm-backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    networks:
      - tm-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: tm-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - tm-net
    restart: unless-stopped

networks:
  tm-net:
    driver: bridge
