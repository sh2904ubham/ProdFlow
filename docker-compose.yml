version: "3.8"

services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - tm-net

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/taskmanager
      JWT_SECRET: supersecret
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    networks:
      - tm-net

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - tm-net

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    ports:
      - "8080:8080"
    networks:
      - tm-net
    depends_on:
      - backend

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    environment:
      TELEGRAM_TOKEN: YOUR_TELEGRAM_BOT_TOKEN
      BACKEND_API: http://backend:5000
      OPENCLAW_API: http://openclaw:8080
    depends_on:
      - openclaw
      - backend
    networks:
      - tm-net

volumes:
  mongo-data:

networks:
  tm-net:
    driver: bridge
