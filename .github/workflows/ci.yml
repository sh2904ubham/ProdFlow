name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Backend | Install & Test
        working-directory: ./backend
        run: |
          npm ci
          npm test --if-present

      - name: Frontend | Install & Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build